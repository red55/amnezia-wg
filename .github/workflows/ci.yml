name: CI

on:
  push:
    branches:
      - main
    paths:
      - github/workflows/ci.yml
      - Dockerfile
      - start.sh
  pull_request:
    branches:
      - main

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        env:
          NODE_ENV: production
        run: |
          docker buildx build --target final --tag red55/amnezia-wg:latest .
          docker push red55/amnezia-wg:latest